name: Linux integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  integration:
    name: Integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nftables util-linux coreutils sudo
          sudo modprobe nf_tables

      - name: Show the test environment
        run: |
          echo "Kernel version: $(uname -r)"
          echo "Architecture: $(uname -m)"
          nft --version

      - name: Run integration tests
        # Each test creates its own privileged child in a fresh network namespace.
        run: cargo test --locked --test tables -- --ignored --nocapture
