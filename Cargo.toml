[package]
name = "spacenft"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "a minimal library to interact with linux nftables"
readme = "README.md"
license = "MIT"

[dependencies]
netlink-packet-core = "0.9"
netlink-sys = "0.9"
nix = { version = "0.31.3", features = ["socket", "net"] }
