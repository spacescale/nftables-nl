[package]
name = "nftables-nl"
version = "0.1.0"
edition = "2024"
authors = ["Tobi Ogundiyan <apprentice_py@icloud.com>"]
repository = "https://github.com/spacescale/nftables-nl"
rust-version = "1.99"
description = "a rust minimal library to interact with linux nftables"
readme = "README.md"
keywords = ["nftables", "netfilter", "firewall", "iptabes"]
categories = ["os", "network-programming"]
license = "MIT"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unused_self = "warn"
inefficient_to_string = "warn"
todo = "deny"
dbg_macro = "deny"
enum_glob_use = "deny"
clone_on_ref_ptr = "deny"


[dependencies]
netlink-packet-core = "0.9"
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys = "0.9"
